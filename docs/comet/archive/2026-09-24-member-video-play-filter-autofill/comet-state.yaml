acceptance:
  - id: A1
    source: brief.md
    text: A1 过滤开启且过滤后可见内容不足以铺满当前页面、且未到底时，列表自动请求下一页并重新过滤，无需用户上下滑动。
    result: passed
    reason:
      text: onFilterChanged 在过滤开启且未到底时进入 _autoLoadMoreLoop；_buildBody 在有可见项时也会
        scheduleAutoLoadMore。循环条件要求未铺满才继续 onLoadMore，customHandleResponse 末尾
        applyFilter 重新过滤。测试「过滤后不足一屏时自动翻页，铺满后停止」覆盖了这一路径。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 自动补载持续进行，直到可见内容铺满当前页面后停止；此后恢复手动上拉加载，不继续自动请求。
    result: passed
    reason:
      text: 循环在 filteredContentFillsViewport 为 true 时退出，退出后 autoLoadPaused 为
        false，scheduleAutoLoadMore 在 isAutoLoading 时直接返回，不会继续自动请求。此后只有尾项构建时调用
        manualLoadMore。同一测试断言 isEnd 仍为 false、请求数小于总页数、autoLoadPaused 为 false。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 自动补载在作者视频全部加载完毕（`isEnd`）时停止；若一条可见内容都没有，显示现有「没有更多了 / 调整过滤条件」空态。
    result: passed
    reason:
      text: customHandleResponse 在视频类型 hasNext==false 或空列表、其他类型 next==0 或空列表时置
        isEnd。循环条件包含 !isEnd。列表为空且 isEnd 时 _buildFilteredOutEnd
        显示「没有更多了」和「调整过滤条件」。测试覆盖到底后停止且 filteredList 为空；空态文案由现有视图代码保证。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 单次自动补载连续翻页达到 50 页上限后暂停，不再继续自动请求，并给出可理解的提示；用户手动上拉后可继续加载。
    result: passed
    reason:
      text: autoLoadMaxPages 为 50，pagesLoaded 只在拿到新数据后加一，达到上限且仍未铺满、未到底时 autoLoadPaused
        为 true。视图显示「已连续加载较多内容，上拉可继续加载」，scheduleAutoLoadMore
        在暂停态直接返回。manualLoadMore 清除暂停态。测试用 maxPages:2 覆盖暂停、暂停后不再请求、手动上拉后继续。
      truncated: false
  - id: A5
    source: brief.md
    text: A5 请求失败或一页没有带来新数据时停止自动补载，不形成请求风暴。
    result: passed
    reason:
      text: onLoadMore 失败时 queryData 不改列表长度。循环发现 newLength<=prevLength 立即
        break，不重试同一页；同一时刻只有一个 _autoLoadTask。测试断言首屏 1 次加失败 1 次后不再请求。一页无新数据走同一
        break，属于同一停止条件。
      truncated: false
  - id: A6
    source: brief.md
    text: A6 过滤未开启时加载行为不变：仍只在滚动到尾项时加载下一页，不自动连翻。
    result: passed
    reason:
      text: onFilterChanged 和 _buildBody 的调度都要求 hasActiveFilter。未开启过滤时尾项仍走原来的
        onLoadMore，不进入自动循环。测试「过滤未开启时不会自动连翻」断言调用 onFilterChanged 和
        scheduleAutoLoadMore 后请求数不变。
      truncated: false
  - id: A7
    source: brief.md
    text: A7 过滤判定 `shouldHide`、筛选弹窗与现有单测不被破坏，继续通过。
    result: passed
    reason:
      text: 本次未改 shouldHide 与筛选弹窗语义，弹窗关闭仍经 _applyFilterFromDialog 调用
        onFilterChanged。Runtime 已通过 dart analyze，以及
        video_filter_test.dart、member_video_filter_dialog_test.dart 原有 20 个用例。
      truncated: false
  - id: A8
    source: specs/member-video-filter/spec.md
    text: 过滤后不足一屏时自动继续翻页 - GIVEN 播放量筛选已开启，且作者视频尚未加载完毕（`isEnd == false`） - WHEN
      过滤后可见内容不足以铺满当前页面 - THEN 列表自动请求下一页并按当前条件重新过滤，无需用户上下滑动
    result: passed
    reason:
      text: 与 A1 同一规格场景：过滤开启、isEnd 为 false、可见内容未铺满时自动请求下一页并重新过滤，不依赖用户滚动。
      truncated: false
  - id: A9
    source: specs/member-video-filter/spec.md
    text: 可见内容铺满页面后停止自动翻页 - GIVEN 自动补载正在进行 - WHEN 过滤后可见内容已铺满当前页面 - THEN
      自动翻页停止，此后仅在用户手动上拉到列表尾部时才加载下一页
    result: passed
    reason:
      text: 与 A2 同一规格场景：铺满后循环停止，之后只由尾项 manualLoadMore 加载下一页。
      truncated: false
  - id: A10
    source: specs/member-video-filter/spec.md
    text: 作者视频全部加载完毕时停止 - GIVEN 自动补载正在进行 - WHEN 作者视频已全部加载完毕（`isEnd`：视频类型 `hasNext ==
      false` 或返回空列表，其他分页类型 `next == 0` 或返回空列表） - THEN
      自动翻页停止；若一条可见内容都没有，显示「没有更多了」并保留「调整过滤条件」入口
    result: passed
    reason:
      text: 与 A3 同一规格场景：isEnd 语义与规格一致，到底后停止；无可见项时保留「没有更多了」和「调整过滤条件」。
      truncated: false
  - id: A11
    source: specs/member-video-filter/spec.md
    text: 连续翻页达到安全上限后暂停 - GIVEN 一次自动补载已连续请求 50 页 - WHEN 可见内容仍未铺满当前页面且尚未到底 - THEN
      自动翻页暂停并给出可理解的提示，不再继续自动请求；用户手动上拉后可继续加载
    result: passed
    reason:
      text: 与 A4 同一规格场景：默认连续 50 页后暂停并提示，手动上拉清除暂停态后可继续。
      truncated: false
  - id: A12
    source: specs/member-video-filter/spec.md
    text: 请求失败或无进展时停止 - GIVEN 自动补载正在进行 - WHEN 某一页请求失败，或该页没有带来新的视频数据 - THEN
      自动翻页立即停止，不重复请求同一页，不形成请求风暴
    result: passed
    reason:
      text: 与 A5 同一规格场景：请求失败或该页没有新数据时立即停止，不重复请求同一页。
      truncated: false
  - id: A13
    source: specs/member-video-filter/spec.md
    text: 过滤未开启时加载行为不变 - GIVEN 没有任何过滤条件生效 - WHEN 列表展示作者视频 - THEN
      仍只在滚动到列表尾项时加载下一页，不自动连续翻页
    result: passed
    reason:
      text: 与 A6 同一规格场景：无过滤条件时不自动连翻，仍只在滚动到尾项时加载下一页。
      truncated: false
