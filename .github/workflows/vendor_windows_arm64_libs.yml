name: Vendor Windows ARM64 ARMv8.0 libraries

# Builds the Snapdragon 835 baseline archives. Do not run this on every app build.
# First run compiles LLVM (~2h) plus the aarch64 MinGW sysroot, then libmpv.
# After it publishes tag windows-arm64-libs, pin the MD5 in
# windows/packaging/arm64/vendor.json.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload archives to the windows-arm64-libs release tag"
        required: false
        default: false
        type: boolean

env:
  CACHE_PREFIX: mpv-winbuild-armv8a-v2

jobs:
  toolchain:
    name: Clang aarch64 sysroot
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Checkout mpv-winbuild-cmake
        uses: actions/checkout@v7
        with:
          repository: bggRGjQaUbCoE/mpv-winbuild-cmake
          ref: master
          path: mpv-winbuild-cmake

      - name: Restore clang sysroot
        uses: actions/cache/restore@v4
        with:
          path: |
            mpv-winbuild-cmake/clang_root
            mpv-winbuild-cmake/build_aarch64
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-toolchain-

      - name: Restore package sources
        uses: actions/cache/restore@v4
        with:
          path: mpv-winbuild-cmake/src_packages
          key: ${{ env.CACHE_PREFIX }}-src-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-src-

      - name: Configure
        working-directory: mpv-winbuild-cmake
        run: |
          cmake -DTARGET_ARCH=aarch64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=clang \
            -DGCC_ARCH=generic \
            -DCLANG_FLAGS="-march=armv8-a" \
            -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" \
            -DMINGW_INSTALL_PREFIX="$PWD/build_aarch64/aarch64-w64-mingw32" \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
            -DENABLE_CCACHE=ON \
            -DLLVM_CCACHE_BUILD=ON \
            -G Ninja \
            --fresh \
            -B build_aarch64 \
            -S "$PWD"

      - name: Build LLVM then llvm-clang
        working-directory: mpv-winbuild-cmake
        run: |
          # llvm-clang does not depend on llvm. Wrappers are written first and
          # mingw-w64-crt configure then fails because clang_root/bin/clang is missing.
          heartbeat() {
            local label="$1"
            while true; do
              sleep 60
              echo "===== ${label} heartbeat $(date -u +%H:%M:%S) ====="
              find build_aarch64 -type f \( \
                -name "${label}-configure*.log" -o \
                -name "${label}-build*.log" -o \
                -name CMakeOutput.log -o \
                -name CMakeError.log \
              \) -print |
                while IFS= read -r f; do
                  echo "-- $f --"
                  tail -n 20 "$f" || true
                done
            done
          }
          if [ ! -x clang_root/bin/clang ]; then
            heartbeat llvm &
            heart=$!
            ninja -C build_aarch64 llvm
            kill "$heart" 2>/dev/null || true
            wait "$heart" 2>/dev/null || true
          fi
          if [ ! -x clang_root/install_rustup/.cargo/bin/rustc ]; then
            ninja -C build_aarch64 rustup
          fi
          if [ -x clang_root/bin/clang ] && \
             [ -f build_aarch64/aarch64-w64-mingw32/lib/libmingw32.a ]; then
            echo "clang sysroot already present; skipping llvm-clang"
          else
            heartbeat llvm-clang &
            heart=$!
            ninja -C build_aarch64 llvm-clang
            kill "$heart" 2>/dev/null || true
            wait "$heart" 2>/dev/null || true
          fi
          test -x clang_root/bin/clang
          test -x clang_root/bin/aarch64-w64-mingw32-clang
          test -f build_aarch64/aarch64-w64-mingw32/lib/libmingw32.a

      - name: Collect toolchain logs
        if: always()
        working-directory: mpv-winbuild-cmake
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor-out/logs"
          echo "===== mingw-w64-crt configure ====="
          find build_aarch64 -name 'mingw-w64-crt-configure*.log' -print -exec tail -n 120 {} \; || true
          find build_aarch64 -type f \( -name '*-*.log' -o -name 'config.log' \) -print |
            while IFS= read -r f; do
              echo "===== $f ====="
              tail -n 80 "$f" || true
            done
          cp -fr $(find build_aarch64 -type f \( -iname '*-*.log' -o -name 'config.log' \)) \
            "$GITHUB_WORKSPACE/vendor-out/logs" || true
          7z a -m0=lzma2 -mx=9 "$GITHUB_WORKSPACE/vendor-out/toolchain-armv8a-logs.7z" \
            "$GITHUB_WORKSPACE/vendor-out/logs" || true

      - name: Upload toolchain logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: toolchain-armv8a-logs
          path: vendor-out/toolchain-armv8a-logs.7z
          if-no-files-found: ignore
          retention-days: 5

      - name: Drop LLVM object files before cache
        if: always()
        working-directory: mpv-winbuild-cmake
        run: rm -rf build_aarch64/toolchain build_aarch64/packages

      - name: Save clang sysroot
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            mpv-winbuild-cmake/clang_root
            mpv-winbuild-cmake/build_aarch64
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ github.run_id }}

      - name: Save package sources
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: mpv-winbuild-cmake/src_packages
          key: ${{ env.CACHE_PREFIX }}-src-${{ github.run_id }}

  mpv-armv8a:
    name: libmpv aarch64 -mcpu=generic
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Setup git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Checkout PiliPlus scripts
        uses: actions/checkout@v7
        with:
          path: piliplus

      - name: Checkout mpv-winbuild-cmake
        uses: actions/checkout@v7
        with:
          repository: bggRGjQaUbCoE/mpv-winbuild-cmake
          ref: master
          path: mpv-winbuild-cmake

      - name: Restore clang sysroot
        uses: actions/cache/restore@v4
        with:
          path: |
            mpv-winbuild-cmake/clang_root
            mpv-winbuild-cmake/build_aarch64
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-toolchain-

      - name: Restore package sources
        uses: actions/cache/restore@v4
        with:
          path: mpv-winbuild-cmake/src_packages
          key: ${{ env.CACHE_PREFIX }}-src-full-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-src-full-
            ${{ env.CACHE_PREFIX }}-src-

      - name: Configure and build libmpv
        working-directory: mpv-winbuild-cmake
        run: |
          test -x clang_root/bin/clang
          test -x clang_root/bin/aarch64-w64-mingw32-clang
          # Intel oneVPL has no ARM64 Windows backend. Keep a dummy target so
          # ffmpeg's DEPENDS graph stays valid, and disable the FFmpeg hook.
          dummy_pkg() {
            printf '%s\n' \
              "ExternalProject_Add($1" \
              '  DOWNLOAD_COMMAND ""' \
              '  UPDATE_COMMAND ""' \
              '  CONFIGURE_COMMAND ""' \
              '  BUILD_COMMAND ""' \
              '  INSTALL_COMMAND ""' \
              ')' > "packages/$1.cmake"
          }
          # Intel oneVPL has no ARM64 Windows backend.
          dummy_pkg libvpl
          sed -i '/^ libvpl$/d; s/--enable-libvpl/--disable-libvpl/' packages/ffmpeg.cmake
          # libcurl is not a libmpv/FFmpeg dependency here (openssl/libssh/libsrt).
          dummy_pkg curl
          cmake -DTARGET_ARCH=aarch64-w64-mingw32 \
            -DCOMPILER_TOOLCHAIN=clang \
            -DGCC_ARCH=generic \
            -DCLANG_FLAGS="-march=armv8-a" \
            -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" \
            -DMINGW_INSTALL_PREFIX="$PWD/build_aarch64/aarch64-w64-mingw32" \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
            -DENABLE_CCACHE=ON \
            -G Ninja \
            --fresh \
            -B build_aarch64 \
            -S "$PWD"
          ninja -C build_aarch64 download || true
          ninja -C build_aarch64 update
          if ! ninja -C build_aarch64 mpv; then
            echo "===== newest ExternalProject error logs ====="
            find build_aarch64 -type f \( -name '*-build-err.log' -o -name '*-configure-err.log' \) \
              -printf '%T@ %p\n' | sort -nr | head -n 8 | while read -r _ f; do
              echo "===== $f ====="
              tail -n 80 "$f" || true
            done
            exit 1
          fi
          ninja -C build_aarch64 mpv-packaging
          mkdir -p "$GITHUB_WORKSPACE/vendor-out"
          DEV=$(find build_aarch64 -name 'mpv-dev-aarch64*.7z' | head -n 1)
          if [ -z "$DEV" ]; then
            echo "mpv-dev-aarch64 archive not found"
            find build_aarch64 -name '*.7z' -print
            exit 1
          fi
          cp "$DEV" "$GITHUB_WORKSPACE/vendor-out/mpv-dev-aarch64-armv8a.7z"
          md5sum "$GITHUB_WORKSPACE/vendor-out/mpv-dev-aarch64-armv8a.7z" |
            tee "$GITHUB_WORKSPACE/vendor-out/mpv-dev-aarch64-armv8a.md5"
          mkdir -p "$GITHUB_WORKSPACE/vendor-out/mpv"
          7z x "$GITHUB_WORKSPACE/vendor-out/mpv-dev-aarch64-armv8a.7z" \
            -o"$GITHUB_WORKSPACE/vendor-out/mpv"
          python3 "$GITHUB_WORKSPACE/piliplus/lib/scripts/check_windows_arm64_binaries.py" \
            "$GITHUB_WORKSPACE/vendor-out/mpv" \
            --opcode-file libmpv-2.dll

      - name: Collect libmpv logs
        if: always()
        working-directory: mpv-winbuild-cmake
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vendor-out/logs"
          find build_aarch64 -type f \( -name '*-configure-*.log' -o -name '*-build-*.log' -o -name 'config.log' \) -print |
            while IFS= read -r f; do
              echo "===== $f ====="
              tail -n 80 "$f" || true
            done
          cp -fr $(find build_aarch64 -type f \( -iname '*-*.log' -o -wholename '*/ffbuild/config.log' \)) \
            "$GITHUB_WORKSPACE/vendor-out/logs" || true
          7z a -m0=lzma2 -mx=9 "$GITHUB_WORKSPACE/vendor-out/mpv-armv8a-logs.7z" \
            "$GITHUB_WORKSPACE/vendor-out/logs" || true

      - name: Upload libmpv archive
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: mpv-dev-aarch64-armv8a
          path: vendor-out/mpv-dev-aarch64-armv8a.7z

      - name: Upload libmpv md5
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: mpv-dev-aarch64-armv8a-md5
          path: vendor-out/mpv-dev-aarch64-armv8a.md5

      - name: Upload libmpv logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: mpv-armv8a-logs
          path: vendor-out/mpv-armv8a-logs.7z
          if-no-files-found: ignore
          retention-days: 5

      - name: Save package sources
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: mpv-winbuild-cmake/src_packages
          key: ${{ env.CACHE_PREFIX }}-src-full-${{ github.run_id }}

  angle-armv8a:
    name: ANGLE ARM64 armv8-a
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: piliplus

      - name: Download depot_tools
        shell: cmd
        run: git clone --filter=tree:0 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools

      - name: Put depot_tools at the front of PATH
        shell: pwsh
        run: |
          $Depot = Join-Path $env:GITHUB_WORKSPACE 'depot_tools'
          Add-Content -Path $env:GITHUB_PATH -Value $Depot
          Write-Host "depot_tools $Depot"

      - name: Bootstrap depot_tools
        shell: cmd
        run: |
          set "PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%"
          where gclient
          call gclient.bat
          exit /b 0

      - name: Fetch and sync ANGLE
        shell: cmd
        run: |
          set "PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%"
          where fetch
          where gclient
          mkdir angle
          cd angle
          call fetch.bat angle
          call gclient.bat sync

      - name: Pin a complete Windows SDK for Chromium
        shell: pwsh
        run: |
          $Kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          Write-Host "Installed Include trees:"
          if (Test-Path $Kits) { Get-ChildItem $Kits | ForEach-Object { $_.FullName } }
          $Need = Join-Path $Kits '10.0.28000.0\um\Windows.h'
          if (-not (Test-Path $Need)) {
            Write-Host "10.0.28000.0 um is missing; trying winget"
            try {
              winget install --id Microsoft.WindowsSDK.10.0.28000 -e --accept-package-agreements --accept-source-agreements --disable-interactivity
            } catch {
              Write-Host "winget install failed: $_"
            }
          }
          $Sdk = $null
          foreach ($Ver in @('10.0.28000.0', '10.0.26100.0')) {
            if (Test-Path (Join-Path $Kits "$Ver\um\Windows.h")) { $Sdk = $Ver; break }
          }
          if (-not $Sdk) { throw "no usable Windows SDK um headers under $Kits" }
          Write-Host "Using Windows SDK $Sdk"
          $Re = "SDK_VERSION = '[^']+'"
          $New = "SDK_VERSION = '$Sdk'"
          foreach ($Rel in @(
            'angle\build\toolchain\win\setup_toolchain.py',
            'angle\build\vs_toolchain.py'
          )) {
            $Path = Join-Path $env:GITHUB_WORKSPACE $Rel
            if (-not (Test-Path $Path)) { continue }
            $Text = Get-Content -Raw $Path
            $Updated = [regex]::Replace($Text, $Re, $New)
            if ($Updated -eq $Text) {
              Write-Host "no SDK_VERSION in $Rel"
            } else {
              Set-Content -Path $Path -Value $Updated -NoNewline
              Write-Host "pinned $Rel to $Sdk"
            }
          }
          $Sdkddk = Join-Path $Kits "$Sdk\shared\sdkddkver.h"
          $SdkddkText = Get-Content -Raw $Sdkddk
          $Ntddi = $null
          foreach ($Name in @('NTDDI_WIN11_BR', 'NTDDI_WIN11_SE', 'NTDDI_WIN11_GE', 'NTDDI_WIN11_GA', 'NTDDI_WIN10_NI')) {
            if ($SdkddkText -match $Name) { $Ntddi = $Name; break }
          }
          if (-not $Ntddi) { throw "no NTDDI_WIN* macro in $Sdkddk" }
          Write-Host "SDK $Sdk defines $Ntddi"
          $WinVer = Join-Path $env:GITHUB_WORKSPACE 'angle\build\config\win\BUILD.gn'
          if (Test-Path $WinVer) {
            $Text = Get-Content -Raw $WinVer
            $Updated = [regex]::Replace($Text, 'NTDDI_VERSION=NTDDI_WIN[A-Z0-9_]+', "NTDDI_VERSION=$Ntddi")
            $ArchFlags = 'cflags += [ "--target=aarch64-pc-windows", "/clang:-march=armv8-a", "/clang:-mno-lse", "/clang:-mno-outline-atomics" ]'
            $Updated = [regex]::Replace(
              $Updated,
              'cflags \+= \[ "--target=aarch64-pc-windows" \]',
              $ArchFlags
            )
            if ($Updated -eq $Text) {
              Write-Host "no NTDDI_VERSION / arm64 target rewrite in $WinVer"
            } else {
              Set-Content -Path $WinVer -Value $Updated -NoNewline
              Write-Host "pinned $WinVer to $Ntddi and ARMv8.0 cflags"
            }
          }

      - name: Configure ANGLE D3D11 ARMv8.0
        working-directory: angle
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\depot_tools;$env:PATH"
          $env:INCLUDE = $null
          $env:LIB = $null
          $env:LIBPATH = $null
          $env:VSINSTALLDIR = $null
          New-Item -ItemType Directory -Force -Path out/armv8a | Out-Null
          @(
            'target_cpu = "arm64"'
            'target_os = "win"'
            'is_debug = false'
            'chrome_pgo_phase = 0'
            'is_component_build = false'
            'angle_enable_d3d9 = false'
            'angle_enable_gl = false'
            'angle_enable_vulkan = false'
            'angle_enable_swiftshader = false'
            'angle_enable_wgpu = false'
            'angle_enable_null = false'
            'angle_build_tests = false'
            'treat_warnings_as_errors = false'
            'symbol_level = 0'
            'extra_cflags = "/clang:-march=armv8-a /clang:-mno-lse /clang:-mno-outline-atomics"'
            'extra_cxxflags = "/clang:-march=armv8-a /clang:-mno-lse /clang:-mno-outline-atomics"'
            'extra_cppflags = "/clang:-march=armv8-a /clang:-mno-lse /clang:-mno-outline-atomics"'
          ) | Set-Content -Encoding ascii -Path out/armv8a/args.gn
          Get-Content out/armv8a/args.gn
          gn gen out/armv8a
          gn ls out/armv8a --type=shared_library
          foreach ($Label in @('//:libGLESv2', '//src/libGLESv2:libGLESv2')) {
            gn desc out/armv8a $Label cflags
            if ($LASTEXITCODE -eq 0) {
              gn desc out/armv8a $Label cflags_cc
              break
            }
          }

      - name: Build libEGL libGLESv2
        working-directory: angle
        shell: cmd
        run: |
          set "PATH=%GITHUB_WORKSPACE%\depot_tools;%PATH%"
          autoninja -C out/armv8a libEGL libGLESv2

      - name: Check built ANGLE DLLs before packaging
        shell: pwsh
        run: |
          $Built = @(
            Get-ChildItem -Recurse -Path angle\out\armv8a -Filter libEGL.dll
            Get-ChildItem -Recurse -Path angle\out\armv8a -Filter libGLESv2.dll
          )
          if ($Built.Count -lt 2) { throw "built libEGL.dll / libGLESv2.dll not found under angle/out/armv8a" }
          $Stage = 'vendor-out/angle-check'
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          foreach ($F in $Built) {
            Write-Host ("built {0} md5={1}" -f $F.FullName, (Get-FileHash -Algorithm MD5 $F.FullName).Hash.ToLowerInvariant())
            Copy-Item -Force $F.FullName (Join-Path $Stage $F.Name)
          }
          python piliplus/lib/scripts/check_windows_arm64_binaries.py $Stage `
            --opcode-file libEGL.dll `
            --opcode-file libGLESv2.dll

      - name: Package ANGLE archive
        shell: pwsh
        run: |
          choco install 7zip -y
          New-Item -ItemType Directory -Force -Path vendor-out/ANGLE | Out-Null
          curl.exe -L -o "$env:TEMP\ANGLE_WINARM64.7z" "https://github.com/talynone/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE_WINARM64.7z"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\ANGLE_WINARM64.7z" "-ovendor-out/ANGLE"
          $Built = @(
            Get-ChildItem -Recurse -Path angle\out\armv8a -Filter libEGL.dll
            Get-ChildItem -Recurse -Path angle\out\armv8a -Filter libGLESv2.dll
          )
          foreach ($Name in @('libEGL.dll', 'libGLESv2.dll')) {
            $Src = $Built | Where-Object { $_.Name -eq $Name } | Select-Object -First 1
            if (-not $Src) { throw "missing built $Name" }
            $Dest = Get-ChildItem -Recurse -Path vendor-out/ANGLE -Filter $Name | Select-Object -First 1
            $SrcHash = (Get-FileHash -Algorithm MD5 $Src.FullName).Hash
            if ($Dest) {
              $OldHash = (Get-FileHash -Algorithm MD5 $Dest.FullName).Hash
              Write-Host ("replace {0} {1} -> {2}" -f $Name, $OldHash, $SrcHash)
              if ($OldHash -eq $SrcHash) {
                throw "$Name hash still matches the talynone archive"
              }
              Copy-Item -Force $Src.FullName $Dest.FullName
            } else {
              Copy-Item -Force $Src.FullName (Join-Path vendor-out/ANGLE $Name)
            }
          }
          if (Test-Path vendor-out/ANGLE/libc++.dll) {
            Remove-Item -Force vendor-out/ANGLE/libc++.dll
          }
          & "C:\Program Files\7-Zip\7z.exe" a -t7z vendor-out/ANGLE_WINARM64_armv8a.7z ".\vendor-out\ANGLE\*"
          (Get-FileHash -Algorithm MD5 vendor-out/ANGLE_WINARM64_armv8a.7z).Hash.ToLowerInvariant() |
            Set-Content vendor-out/ANGLE_WINARM64_armv8a.md5

      - name: Check ANGLE Snapdragon 835 opcodes
        shell: pwsh
        run: |
          python piliplus/lib/scripts/check_windows_arm64_binaries.py vendor-out/ANGLE `
            --opcode-file libEGL.dll `
            --opcode-file libGLESv2.dll

      - name: Upload ANGLE archive
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ANGLE_WINARM64_armv8a
          path: vendor-out/ANGLE_WINARM64_armv8a.7z

      - name: Upload ANGLE md5
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ANGLE_WINARM64_armv8a-md5
          path: vendor-out/ANGLE_WINARM64_armv8a.md5

  publish:
    name: Publish windows-arm64-libs
    if: ${{ inputs.publish_release }}
    needs: [mpv-armv8a, angle-armv8a]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          path: vendor-out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-arm64-libs
          name: windows-arm64-libs
          files: |
            vendor-out/mpv-dev-aarch64-armv8a.7z
            vendor-out/ANGLE_WINARM64_armv8a.7z
          body: |
            ARMv8.0-A Windows ARM64 native libraries for Snapdragon 835.
            libmpv was built with -DGCC_ARCH=generic -DCLANG_FLAGS=-march=armv8-a.
            ANGLE libEGL/libGLESv2 were rebuilt with Chromium Clang -march=armv8-a.
            Pin MD5 sums from the sibling .md5 artifacts into windows/packaging/arm64/vendor.json.
