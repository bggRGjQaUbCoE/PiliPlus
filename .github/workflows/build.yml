name: Build

on:
  # pull_request:
  #     types:
  #         - opened
  #         - synchronize
  #         - reopened
  #         - ready_for_review
  #     paths-ignore:
  #         - "**.md"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_ios:
        description: "Build iOS"
        required: false
        default: false
        type: boolean
      build_mac:
        description: "Build Mac"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Win-x64"
        required: false
        default: false
        type: boolean
      build_linux_x64:
        description: "Build Linux-x64"
        required: false
        default: false
        type: boolean
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string

jobs:
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    uses: ./.github/workflows/android_reusable.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
      dev: false
    secrets: inherit

  ios:
    if: ${{ github.event.inputs.build_ios == 'true' }}
    uses: ./.github/workflows/ios.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
    secrets: inherit

  mac:
    if: ${{ github.event.inputs.build_mac == 'true' }}
    uses: ./.github/workflows/mac.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  win_x64:
    if: ${{ github.event.inputs.build_win_x64 == 'true' }}
    uses: ./.github/workflows/win_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  linux_x64:
    if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
    uses: ./.github/workflows/linux_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
