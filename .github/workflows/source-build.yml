name: Locked source and native package builds

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of platforms to build
        type: string
        default: '["android","windows","linux","ios","macos","ohos"]'
      native_mode:
        description: auto uses the reviewed per-platform source or binary profile
        type: choice
        options: [auto, source, upstream, package]
        default: auto
  push:
    branches: ['goodwu-dev-rebased', 'ci/native-packages-*']
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      media_kit_ref: ${{ steps.plan.outputs.media_kit_ref }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze current Goodwu/media-kit dev SHA once for this build
        id: media_sdk
        shell: bash
        run: |
          set -euo pipefail
          sdk_sha=$(git ls-remote --exit-code https://github.com/Goodwu/media-kit.git refs/heads/dev | cut -f1)
          [[ "$sdk_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid media-kit dev ref" >&2; exit 1; }
          printf 'sha=%s\n' "$sdk_sha" >> "$GITHUB_OUTPUT"
          echo "Using media-kit dev at $sdk_sha for all requested platforms"
      - name: Resolve only immutable native inputs
        id: plan
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms || '["android","windows","linux","ios","macos","ohos"]' }}
          NATIVE_MODE: ${{ inputs.native_mode || 'auto' }}
          RESOLVED_MEDIA_KIT_SHA: ${{ steps.media_sdk.outputs.sha }}
        run: python tool/native/ci.py plan --media-kit-commit "$RESOLVED_MEDIA_KIT_SHA" --platforms "$SELECTED_PLATFORMS" --mode "$NATIVE_MODE"
      - name: Check native transport contracts
        run: python -m unittest discover -s tool/native/tests -v

  build:
    name: Build / ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      mode: ${{ matrix.mode }}
      native_runner: ${{ matrix.native_runner }}
      app_runner: ${{ matrix.app_runner }}
      cache_key: ${{ matrix.cache_key }}
      media_kit_ref: ${{ needs.plan.outputs.media_kit_ref }}
      flutter_version: ${{ needs.plan.outputs.flutter_version }}
