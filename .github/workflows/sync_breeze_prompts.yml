name: Sync BiliBreeze prompts

# The classification prompts and default thresholds are maintained in BiliBreeze
# (https://github.com/PosvdM/bili-breeze, prompts/). This workflow copies
# them with .github/scripts/sync-breeze-prompts.cjs and opens a pull request;
# nothing is committed to the base branch directly. Prompts are compiled into
# the app; nothing is downloaded at runtime.
#
# Opening pull requests needs "Allow GitHub Actions to create and approve
# pull requests" in Settings > Actions > General. Deleting this file does not
# affect the app.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch (default: the repository's default branch)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-breeze-prompts
  cancel-in-progress: false

env:
  BASE: ${{ inputs.base || github.event.repository.default_branch }}
  BRANCH: breeze/sync-prompts

jobs:
  sync:
    # Scheduled runs only in the main repository, not in forks.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'bggRGjQaUbCoE/PiliPlus'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PiliPlus
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          path: piliplus

      - name: Checkout BiliBreeze
        uses: actions/checkout@v7
        with:
          repository: PosvdM/bili-breeze
          ref: main
          # The generated file names the last commit touching prompts/.
          fetch-depth: 0
          path: bili-breeze

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync prompts
        id: sync
        working-directory: piliplus
        run: |
          node .github/scripts/sync-breeze-prompts.cjs ../bili-breeze . | tee sync.log
          if git diff --quiet -- lib/services/breeze/breeze_prompts.dart test/services/breeze_prompt_fixtures.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(cat sync.log)" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Setup Flutter
        if: steps.sync.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: piliplus/pubspec.yaml

      # Request assembly is Dart code; the fixtures hold the extension's own
      # results, so this fails when BiliBreeze changed logic, not just text.
      - name: Check the Dart port
        id: test
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        working-directory: piliplus
        run: |
          flutter pub get
          flutter test test/services/breeze_rules_test.dart

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        working-directory: piliplus
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
          PASSED: ${{ steps.test.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add lib/services/breeze/breeze_prompts.dart
          git add -f test/services/breeze_prompt_fixtures.json
          git commit -m "chore(breeze): $SUMMARY"
          git push --force origin "$BRANCH"

          if [ "$PASSED" = "true" ]; then
            title="chore(breeze): $SUMMARY"
            body="BiliBreeze 更新了识别 Prompt 或默认阈值，本 PR 由同步脚本生成，一致性测试已通过。

          - 来源：https://github.com/PosvdM/bili-breeze/tree/main/prompts
          - 只改动 \`lib/services/breeze/breeze_prompts.dart\` 和 \`test/services/breeze_prompt_fixtures.json\`
          - 规则版本变化后，已缓存的识别结果会失效，内容会重新识别"
          else
            title="chore(breeze): $SUMMARY（需要手动移植）"
            body="BiliBreeze 改动了请求组装逻辑，Dart 实现与扩展不一致，一致性测试未通过。请参照扩展的 \`prompts/request.js\` 和 \`background.js\` 更新 \`lib/services/breeze/\`，再运行 \`node .github/scripts/sync-breeze-prompts.cjs <bili-breeze> .\`。"
          fi

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
            # A draft marks a pull request that still needs a manual port.
            if [ "$PASSED" = "true" ]; then
              gh pr ready "$BRANCH" || true
            else
              gh pr ready --undo "$BRANCH" || true
            fi
          else
            draft=""
            [ "$PASSED" = "true" ] || draft="--draft"
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body "$body" $draft
          fi
          [ "$PASSED" = "true" ]
