      部过滤后列表恢复完整。"
    result: passed
    reason:
      text: isCompleted/isInProgress + hideCompleted/hideInProgress 两
        SwitchListTile；组合时任一命中即隐藏；reset 清空全部开关，applyFilter 在 !hasActiveFilter 时
        filteredList=list 恢复完整。
      truncated: false
