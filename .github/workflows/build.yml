name: Piliterra Android APK

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (leave empty to upload a workflow artifact only)"
                required: false
                default: ""
                type: string

permissions:
    contents: write

jobs:
    android-arm64:
        name: Build Piliterra arm64-v8a APK
        runs-on: ubuntu-latest

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Android patches
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Require stable signing secrets
              shell: bash
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  for name in SIGN_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
                    if [ -z "${!name}" ]; then
                      echo "Missing required repository secret: ${name}" >&2
                      exit 1
                    fi
                  done

            - name: Configure release signing
              shell: bash
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  {
                    echo "storeFile=key.jks"
                    echo "storePassword=$KEYSTORE_PASSWORD"
                    echo "keyAlias=$KEY_ALIAS"
                    echo "keyPassword=$KEY_PASSWORD"
                  } > android/key.properties

            - name: Set version metadata
              shell: pwsh
              run: lib/scripts/build.ps1

            - name: Build arm64-v8a APK
              run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub

            - name: Name APK
              shell: bash
              run: |
                  version=$(grep '^version:' pubspec.yaml | sed -E 's/version: ([^+]*)\+([0-9]+)/\1+\2/')
                  mv build/app/outputs/flutter-apk/app-release.apk "Piliterra_android_${version}_arm64-v8a.apk"
                  echo "apk_name=Piliterra_android_${version}_arm64-v8a.apk" >> "$GITHUB_ENV"

            - name: Publish APK release
              if: ${{ github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: ${{ env.apk_name }}

            - name: Upload APK artifact
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Piliterra_android_arm64-v8a
                  path: ${{ env.apk_name }}
