name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      # 【修复点】使用 PowerShell 原生命令清理缓存和更新依赖
      - name: Update Dependencies
        shell: pwsh
        run: |
          flutter pub cache clean --force
          Remove-Item -Path pubspec.lock -Force -ErrorAction SilentlyContinue
          flutter pub get
          Write-Host "Current window_manager version:"
          flutter pub deps | Select-String "window_manager"

      - name: Add fastforge
        run: dart pub global activate fastforge

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      # 【修改点】只准备便携版目录，移除安装版相关操作
      - name: Prepare Upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "Release/PiliPlus-Win" -Force
          Move-Item -Path "build/windows/x64/runner/Release/*" -Destination "Release/PiliPlus-Win/" -Force

      - name: Compress
        shell: pwsh
        run: |
          Compress-Archive -Path "Release/PiliPlus-Win" -DestinationPath "PiliPlus_windows_${{env.version}}_x64_portable.zip" -Force

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_windows_*.zip

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: PiliPlus_windows_*.zip
