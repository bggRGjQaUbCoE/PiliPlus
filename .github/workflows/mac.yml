name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS
        continue-on-error: true
      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliNara.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliNara*.dmg PiliNara_macos_${{ env.version }}.dmg

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliNara_macos_*.dmg
            release-manifest.json

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: PiliNara_macos_*.dmg
