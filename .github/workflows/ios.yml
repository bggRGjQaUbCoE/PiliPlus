name: Build for iOS

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: ""
        type: string
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Artifact name"
        required: false
        default: "iOS-release"
        type: string
      file_suffix:
        description: "Optional IPA filename suffix"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish release when non-empty; actual tag uses build number"
        required: false
        default: ""
        type: string

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS
        continue-on-error: true

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliNara_ios_${{env.version}}${{ inputs.file_suffix }}.ipa Payload/runner.app

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliNara_ios_*.ipa
            release-manifest.json

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: PiliNara_ios_*.ipa
