name: Development HEAD and pinned tag native builds

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON array of platforms to build
        type: string
        default: '["android","windows","linux","ios","macos","ohos"]'
      native_mode:
        description: auto uses the reviewed per-platform source or binary profile
        type: choice
        options: [auto, source, upstream, package]
        default: auto
  push:
    branches: ['feature/dv']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      media_kit_ref: ${{ steps.source.outputs.media_kit_ref }}
      source_manifest: ${{ steps.source.outputs.source_manifest }}
      effective_lock_json: ${{ steps.source.outputs.effective_lock_json }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze development HEADs or tagged source anchors once
        id: source
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms || '["android","windows","linux","ios","macos","ohos"]' }}
          NATIVE_MODE: ${{ inputs.native_mode || 'auto' }}
          SOURCE_MODE: ${{ github.ref_type == 'tag' && 'tag' || 'dev' }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          python tool/native/source_plan.py --source-mode "$SOURCE_MODE" --app-commit "$APP_COMMIT" \
            --platforms "$SELECTED_PLATFORMS" --native-mode "$NATIVE_MODE" \
            --effective-output "$RUNNER_TEMP/effective-inputs.json" \
            --manifest-output "$RUNNER_TEMP/source-manifest.json"
      - name: Plan immutable native inputs from this frozen snapshot
        id: plan
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms || '["android","windows","linux","ios","macos","ohos"]' }}
          NATIVE_MODE: ${{ inputs.native_mode || 'auto' }}
          SOURCE_MODE: ${{ github.ref_type == 'tag' && 'tag' || 'dev' }}
          MEDIA_KIT_SHA: ${{ steps.source.outputs.media_kit_ref }}
        run: |
          options=()
          if [ "$SOURCE_MODE" = dev ]; then options+=(--dev-sources); fi
          python tool/native/ci.py --lock "$RUNNER_TEMP/effective-inputs.json" plan \
            --media-kit-commit "$MEDIA_KIT_SHA" --platforms "$SELECTED_PLATFORMS" \
            --mode "$NATIVE_MODE" "${options[@]}"
      - name: Check native transport contracts
        run: python -m unittest discover -s tool/native/tests -v
      - name: Archive selected source identities
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: ${{ runner.temp }}/source-manifest.json
          if-no-files-found: error

  build:
    name: Build / ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      mode: ${{ matrix.mode }}
      native_runner: ${{ matrix.native_runner }}
      app_runner: ${{ matrix.app_runner }}
      cache_key: ${{ matrix.cache_key }}
      media_kit_ref: ${{ needs.plan.outputs.media_kit_ref }}
      source_manifest: ${{ needs.plan.outputs.source_manifest }}
      effective_lock_json: ${{ needs.plan.outputs.effective_lock_json }}
      flutter_version: ${{ needs.plan.outputs.flutter_version }}
