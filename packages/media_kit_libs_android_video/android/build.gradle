import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task stageCaptureDependencies {
    doLast {
        def source = file("../../../native/artifacts/android")
        if (!source.exists()) throw new GradleException("Build native capture libraries first: native/README.md")
        def manifest = new File(source, "SHA256SUMS")
        if (!manifest.exists()) throw new GradleException("Missing native artifact checksums")
        manifest.eachLine { line ->
            def parts = line.split("  ", 2)
            def artifact = new File(source, parts[1])
            def actual = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(artifact.toPath())).encodeHex().toString()
            if (actual != parts[0]) throw new GradleException("Native artifact checksum mismatch: ${artifact}")
        }
        delete file("$buildDir/output")
        copy { from source; include "*.jar"; into "$buildDir/output" }
        if (fileTree("$buildDir/output").matching { include "*.jar" }.isEmpty()) {
            throw new GradleException("Missing capture JNI jars")
        }
    }
}
preBuild.dependsOn(stageCaptureDependencies)
